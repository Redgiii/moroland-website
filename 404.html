<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — Moroland</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070b14">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="error-page">
    <img src="assets/images/logo.svg" alt="" width="56" height="56" class="error-logo">
    <p class="eyebrow">Erreur 404</p>
    <h1>Cette page n'existe pas</h1>
    <p>Le lien est peut-être obsolète, ou la page a été déplacée. Retourne à l'accueil pour retrouver ton chemin sur Moroland.</p>
    <div class="error-actions">
      <a href="/" class="btn btn-primary btn-large">Retour à l'accueil</a>
      <a href="#" class="btn btn-ghost btn-large" id="error-discord-link" target="_blank" rel="noopener noreferrer">Rejoindre le Discord</a>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script>
    document.getElementById("error-discord-link").href = CONFIG.DISCORD_INVITE;
  </script>
</body>
</html>
