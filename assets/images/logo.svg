<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Logo Moroland">
  <defs>
    <linearGradient id="mlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fc4ff"/>
      <stop offset="100%" stop-color="#3b6fe0"/>
    </linearGradient>
  </defs>
  <!-- Contour en forme de blason, simple et lisible en petit format -->
